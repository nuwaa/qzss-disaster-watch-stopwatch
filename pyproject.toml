[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qzss-disaster-watch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["azarashi", "pyserial>=3.5"]

[project.scripts]
qzss-watch = "qzss_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
