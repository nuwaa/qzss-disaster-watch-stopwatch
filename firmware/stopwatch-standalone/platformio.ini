[env:m5stack-stopwatch-standalone]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32s3box
framework = arduino
lib_compat_mode = off
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    https://github.com/tanakamasayuki/EspUsbHost.git#v2.10.1
    https://github.com/baggio63446333/QZQSM.git#43fab43ecdad852f8ea7bfdbfcfc7020038dbb7c
    https://github.com/SWITCHSCIENCE/QZSSDCX.git#5aef03597a046225a409f56c0db1197de89a62ff

[env:m5stack-stopwatch-notification-test]
extends = env:m5stack-stopwatch-standalone
build_flags =
    ${env:m5stack-stopwatch-standalone.build_flags}
    -DQZSS_NOTIFICATION_TEST=1

[env:m5stack-stopwatch-decoder-test]
extends = env:m5stack-stopwatch-standalone
build_flags =
    ${env:m5stack-stopwatch-standalone.build_flags}
    -DQZSS_DECODER_TEST=1
